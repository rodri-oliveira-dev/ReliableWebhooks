# One weekly Dependabot version-update PR across NuGet, .NET SDK, and GitHub Actions.
# Central SDK synchronization (rodri-oliveira-dev/.github) is independent of Dependabot.
version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "weekly-dependencies"
