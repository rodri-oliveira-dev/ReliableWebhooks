name: Temporary persistence documentation sync

on:
  push:
    branches:
      - feature/issue-9-store-conformance

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Align README persistence guidance
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "README.md": [
                  (
                      "> **Status:** v0.1.0 is under development. The first public NuGet package has not been released yet. The current version provides the reliability primitives, concurrent dispatcher, signing, observability, dependency injection, and optional hosted-dispatcher integration described below; the built-in durable store is still part of the work required before the first public release.",
                      "> **Status:** v0.1.0 is under development. The first public NuGet package has not been released yet. The current version provides the reliability primitives, concurrent dispatcher, signing, observability, dependency injection, and optional hosted-dispatcher integration described below. The core defines a technology-agnostic `IWebhookDeliveryStore` contract and conformance semantics; production applications provide the durable store that fits their persistence stack.",
                  ),
                  (
                      "`InMemoryWebhookDeliveryStore` is process-local and **not durable**. It exists for tests and samples only and must not be used as production persistence.",
                      "`InMemoryWebhookDeliveryStore` is process-local and **not durable**. It exists for tests and samples only and must not be used as production persistence.\n\nFor the full persistence contract and conformance guidance, see [`docs/persistence.md`](docs/persistence.md).",
                  ),
                  (
                      "The current development version does not yet include the production durable EF Core store planned for v0.1.0.",
                      "`ReliableWebhooks` v0.1.0 does not require a built-in production persistence adapter. Applications provide a conforming durable `IWebhookDeliveryStore`; optional EF Core, Dapper, Redis, file-backed, or other adapters may be introduced independently.",
                  ),
              ],
              "README.pt-BR.md": [
                  (
                      "> **Status:** a v0.1.0 está em desenvolvimento. O primeiro pacote público no NuGet ainda não foi lançado. A versão atual fornece os componentes de confiabilidade, dispatcher concorrente, assinatura, observabilidade, injeção de dependência e integração opcional com hosted dispatcher descritos abaixo; o store durável nativo ainda faz parte do trabalho necessário antes da primeira release pública.",
                      "> **Status:** a v0.1.0 está em desenvolvimento. O primeiro pacote público no NuGet ainda não foi lançado. A versão atual fornece os componentes de confiabilidade, dispatcher concorrente, assinatura, observabilidade, injeção de dependência e integração opcional com hosted dispatcher descritos abaixo. O core define um contrato `IWebhookDeliveryStore` independente de tecnologia e suas semânticas de conformidade; aplicações de produção fornecem o store durável adequado à sua stack de persistência.",
                  ),
                  (
                      "`InMemoryWebhookDeliveryStore` é local ao processo e **não é durável**. Ele existe apenas para testes e exemplos e não deve ser usado como persistência de produção.",
                      "`InMemoryWebhookDeliveryStore` é local ao processo e **não é durável**. Ele existe apenas para testes e exemplos e não deve ser usado como persistência de produção.\n\nPara o contrato completo de persistência e as orientações de conformidade, consulte [`docs/persistence.pt-BR.md`](docs/persistence.pt-BR.md).",
                  ),
                  (
                      "A versão atual em desenvolvimento ainda não inclui o store durável de produção com EF Core planejado para a v0.1.0.",
                      "A v0.1.0 de `ReliableWebhooks` não exige um adapter de persistência de produção nativo. A aplicação fornece um `IWebhookDeliveryStore` durável compatível; adapters opcionais para EF Core, Dapper, Redis, arquivos ou outras tecnologias podem ser introduzidos de forma independente.",
                  ),
              ],
          }

          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {file_name}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")

      - name: Commit documentation alignment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- README.md README.pt-BR.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.pt-BR.md
          git commit -m "docs: align persistence guidance"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
