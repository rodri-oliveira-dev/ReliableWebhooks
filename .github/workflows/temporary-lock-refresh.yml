name: Temporary lock refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  refresh-locks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Regenerar lock files e mostrar diff
        shell: bash
        run: |
          dotnet restore ReliableWebhooks.slnx --force-evaluate
          git diff -- src/ReliableWebhooks/packages.lock.json tests/ReliableWebhooks.Tests/packages.lock.json
