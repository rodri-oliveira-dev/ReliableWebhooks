name: Temporary issue 13 run

on:
  push:
    branches:
      - release/issue-13-v0.1.0

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Apply prepared changes
        run: python scripts/prepare-issue13.py

      - name: Restore and build
        run: |
          dotnet tool restore
          dotnet restore ReliableWebhooks.slnx --locked-mode
          dotnet build ReliableWebhooks.slnx --configuration Release --no-restore

      - name: Generate public API baseline
        run: >-
          dotnet run --file scripts/verify-public-api.cs --
          src/ReliableWebhooks/bin/Release/net10.0/ReliableWebhooks.dll
          src/ReliableWebhooks/PublicApi.v0.1.0.txt
          --write

      - name: Format and validate
        run: |
          dotnet format ReliableWebhooks.slnx --no-restore
          dotnet build ReliableWebhooks.slnx --configuration Release --no-restore
          dotnet run --file scripts/verify-public-api.cs -- src/ReliableWebhooks/bin/Release/net10.0/ReliableWebhooks.dll src/ReliableWebhooks/PublicApi.v0.1.0.txt
          bash -n scripts/resolve-nuget-publishing.sh
          bash -n scripts/verify-package-consumer.sh

      - name: Commit prepared non-workflow changes
        run: |
          git checkout -- .github/workflows/ci.yml .github/workflows/release.yml
          git rm scripts/prepare-issue13.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: harden v0.1.0 package and release contract"
          git push
