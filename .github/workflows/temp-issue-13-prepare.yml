name: Temporary issue 13 preparation

on:
  push:
    branches:
      - release/issue-13-v0.1.0

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Apply release hardening
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected marker not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          # Package metadata
          replace_once(
              'src/ReliableWebhooks/ReliableWebhooks.csproj',
              '    <Description>\n      Reliable outbound webhook delivery primitives for .NET 10 with explicit delivery outcomes and extensible transport behavior.\n    </Description>\n    <PackageTags>dotnet;csharp;library;net10;nuget;webhooks;http;reliability</PackageTags>\n    <PackageLicenseExpression>MIT</PackageLicenseExpression>',
              '    <Description>\n      Reliable outbound webhook delivery for .NET 10 with pluggable durable persistence, retries, leases, HMAC signing, observability, and DI/hosting integration.\n    </Description>\n    <PackageTags>dotnet;csharp;library;net10;nuget;webhooks;outbound-webhooks;http;reliability;retry;hmac;observability</PackageTags>\n    <PackageLicenseExpression>MIT</PackageLicenseExpression>\n    <PackageRequireLicenseAcceptance>false</PackageRequireLicenseAcceptance>\n    <PackageProjectUrl>https://github.com/rodri-oliveira-dev/ReliableWebhooks</PackageProjectUrl>\n    <Copyright>Copyright (c) 2026 Rodrigo de Oliveira and contributors</Copyright>'
          )
          replace_once(
              'src/ReliableWebhooks/ReliableWebhooks.csproj',
              '    <RepositoryType>git</RepositoryType>\n    <PublishRepositoryUrl>true</PublishRepositoryUrl>',
              '    <RepositoryType>git</RepositoryType>\n    <RepositoryUrl>https://github.com/rodri-oliveira-dev/ReliableWebhooks</RepositoryUrl>\n    <PublishRepositoryUrl>true</PublishRepositoryUrl>'
          )

          badges = '''[![CI](https://github.com/rodri-oliveira-dev/ReliableWebhooks/actions/workflows/ci.yml/badge.svg?branch=main)](https://github.com/rodri-oliveira-dev/ReliableWebhooks/actions/workflows/ci.yml)
          [![Release](https://github.com/rodri-oliveira-dev/ReliableWebhooks/actions/workflows/release.yml/badge.svg)](https://github.com/rodri-oliveira-dev/ReliableWebhooks/actions/workflows/release.yml)
          [![NuGet](https://img.shields.io/nuget/v/ReliableWebhooks.svg)](https://www.nuget.org/packages/ReliableWebhooks/)
          [![.NET 10](https://img.shields.io/badge/.NET-10.0-512BD4)](https://dotnet.microsoft.com/)
          [![License: MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](LICENSE)'''.replace('          ', '')

          replace_once('README.md', '# ReliableWebhooks\n', '# ReliableWebhooks\n\n' + badges + '\n')
          replace_once(
              'README.md',
              '> **Status:** v0.1.0 is under development. The first public NuGet package has not been released yet. The current version provides the reliability primitives, concurrent dispatcher, signing, observability, dependency injection, and optional hosted-dispatcher integration described below. The core defines a technology-agnostic `IWebhookDeliveryStore` contract and conformance semantics; production applications provide the durable store that fits their persistence stack.',
              '> **v0.1.0 scope:** the first public release line provides the reliable-delivery engine, technology-agnostic `IWebhookDeliveryStore` contract, retries, leasing, signing, observability, dependency injection, hosted dispatching, and production guidance. Production restart durability is supplied by a consumer-provided conforming durable store.'
          )
          replace_once(
              'README.md',
              'The planned NuGet package ID is `ReliableWebhooks` and the library targets `net10.0`.\n\nThe first public package has not been published yet. After the v0.1.0 release, installation will be:',
              'The NuGet package ID is `ReliableWebhooks` and the library targets `net10.0`. Install v0.1.0 with:'
          )
          release_scope_en = '''## v0.1.0 boundaries

          The first public release intentionally keeps persistence technology-agnostic:

          - no production durable store is bundled; applications register a conforming `IWebhookDeliveryStore`;
          - `InMemoryWebhookDeliveryStore` is non-durable and intended only for tests, samples, and local development;
          - delivery is at-least-once when backed by a conforming durable store, so receivers must be idempotent;
          - exactly-once delivery, receiver-side idempotency, automatic dead-letter replay, and secret-rotation policy are not guaranteed;
          - EF Core, Dapper, ADO.NET, Redis, files, document databases, and other persistence technologies are optional consumer choices, not core dependencies.

          See [`docs/production-usage.md`](docs/production-usage.md) for production integration and [`docs/release-v0.1.0.md`](docs/release-v0.1.0.md) for release/distribution details.

          '''.replace('          ', '')
          replace_once('README.md', '## Quick start\n', release_scope_en + '## Quick start\n')

          replace_once('README.pt-BR.md', '# ReliableWebhooks\n', '# ReliableWebhooks\n\n' + badges + '\n')
          replace_once(
              'README.pt-BR.md',
              '> **Status:** a v0.1.0 está em desenvolvimento. O primeiro pacote público no NuGet ainda não foi lançado. A versão atual fornece os componentes de confiabilidade, dispatcher concorrente, assinatura, observabilidade, injeção de dependência e integração opcional com hosted dispatcher descritos abaixo. O core define um contrato `IWebhookDeliveryStore` independente de tecnologia e suas semânticas de conformidade; aplicações de produção fornecem o store durável adequado à sua stack de persistência.',
              '> **Escopo da v0.1.0:** a primeira linha pública fornece o engine de entrega confiável, contrato `IWebhookDeliveryStore` independente de tecnologia, retries, leases, assinatura, observabilidade, injeção de dependência, hosted dispatcher e orientação de produção. A durabilidade entre reinícios é fornecida por um store durável e aderente ao contrato escolhido pela aplicação.'
          )
          replace_once(
              'README.pt-BR.md',
              'O Package ID planejado para o NuGet é `ReliableWebhooks` e a biblioteca tem como target `net10.0`.\n\nO primeiro pacote público ainda não foi publicado. Após a release v0.1.0, a instalação será:',
              'O Package ID no NuGet é `ReliableWebhooks` e a biblioteca tem como target `net10.0`. Instale a v0.1.0 com:'
          )
          release_scope_pt = '''## Limites da v0.1.0

          A primeira release pública mantém a persistência intencionalmente independente de tecnologia:

          - nenhum store durável de produção é incluído; a aplicação registra um `IWebhookDeliveryStore` aderente ao contrato;
          - `InMemoryWebhookDeliveryStore` não é durável e serve apenas para testes, samples e desenvolvimento local;
          - a entrega é at-least-once quando apoiada por um store durável aderente, portanto receivers devem ser idempotentes;
          - exactly-once, idempotência no receiver, replay automático de dead letters e política de rotação de secrets não são garantidos;
          - EF Core, Dapper, ADO.NET, Redis, arquivos, bancos de documentos e outras tecnologias são escolhas opcionais do consumidor, não dependências do core.

          Consulte [`docs/production-usage.md`](docs/production-usage.md) para integração de produção e [`docs/release-v0.1.0.md`](docs/release-v0.1.0.md) para detalhes da release/distribuição.

          '''.replace('          ', '')
          replace_once('README.pt-BR.md', '## Começando\n', release_scope_pt + '## Começando\n')

          # Final v0.1.0 changelog section.
          replace_once(
              'CHANGELOG.md',
              '## [Unreleased]\n\n### Added',
              '## [Unreleased]\n\n## [0.1.0] - 2026-09-12\n\n### Added'
          )
          replace_once(
              'CHANGELOG.md',
              '- English and Brazilian Portuguese project documentation.',
              '- English and Brazilian Portuguese project documentation.\n- v0.1.0 release hardening with an explicit public API snapshot, clean package-consumer validation, dual NuGet.org/GitHub Packages publication, and documented release gates.'
          )

          # NuGet publication must be mandatory for an official publish request.
          Path('scripts/resolve-nuget-publishing.sh').write_text('''#!/usr/bin/env bash
          set -euo pipefail

          should_publish="${SHOULD_PUBLISH:-false}"
          nuget_user="${NUGET_USER:-}"

          if [[ "$should_publish" != "true" && "$should_publish" != "false" ]]; then
            echo "::error::SHOULD_PUBLISH must be 'true' or 'false', got '$should_publish'."
            exit 1
          fi

          trimmed_user="${nuget_user#"${nuget_user%%[![:space:]]*}"}"
          trimmed_user="${trimmed_user%"${trimmed_user##*[![:space:]]}"}"

          if [[ "$should_publish" != "true" ]]; then
            echo 'NuGet publication disabled: release publication gate is disabled.'
            {
              echo 'nuget_publishing_enabled=false'
              echo 'nuget_publishing_reason=release-disabled'
            } >> "${GITHUB_OUTPUT:-/dev/stdout}"
            exit 0
          fi

          if [[ -z "$trimmed_user" ]]; then
            echo '::error::Official publication requires repository variable NUGET_USER and a matching NuGet.org Trusted Publishing policy.'
            exit 2
          fi

          echo 'NuGet publication enabled: release publication is requested and NUGET_USER is configured.'
          {
            echo 'nuget_publishing_enabled=true'
            echo 'nuget_publishing_reason=enabled'
          } >> "${GITHUB_OUTPUT:-/dev/stdout}"
          ''').replace('          ', ''), encoding='utf-8', newline='\n')

          Path('scripts/verify-package-consumer.sh').write_text('''#!/usr/bin/env bash
          set -euo pipefail

          if [[ $# -ne 2 ]]; then
            echo "Usage: $0 <package-directory> <version>" >&2
            exit 1
          fi

          package_dir="$(realpath "$1")"
          version="$2"
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT

          dotnet new console --framework net10.0 --output "$consumer" >/dev/null
          project="$(find "$consumer" -maxdepth 1 -name '*.csproj' -print -quit)"
          test -n "$project"

          dotnet add "$project" package ReliableWebhooks \
            --version "$version" \
            --source "$package_dir" \
            --source https://api.nuget.org/v3/index.json >/dev/null
          dotnet add "$project" package Microsoft.Extensions.DependencyInjection \
            --version 10.0.12 \
            --source https://api.nuget.org/v3/index.json >/dev/null

          cat > "$consumer/Program.cs" <<'EOF'
          using Microsoft.Extensions.DependencyInjection;
          using ReliableWebhooks;

          ServiceCollection services = new();
          services.AddSingleton<IWebhookDeliveryStore, CustomStore>();
          services.AddReliableWebhooks();

          using ServiceProvider provider = services.BuildServiceProvider(new ServiceProviderOptions
          {
              ValidateOnBuild = true,
              ValidateScopes = true,
          });

          if (provider.GetRequiredService<IWebhookDeliveryStore>() is not CustomStore)
          {
              throw new InvalidOperationException("Custom IWebhookDeliveryStore registration was not preserved.");
          }

          _ = provider.GetRequiredService<IWebhookEnqueueService>();
          _ = provider.GetRequiredService<WebhookDispatcher>();
          Console.WriteLine("ReliableWebhooks custom-store consumer resolved successfully.");

          file sealed class CustomStore : IWebhookDeliveryStore
          {
              private readonly InMemoryWebhookDeliveryStore inner = new();

              public Task<WebhookEnqueueResult> EnqueueAsync(WebhookMessage message, DateTimeOffset nextAttemptAt, CancellationToken cancellationToken = default) =>
                  inner.EnqueueAsync(message, nextAttemptAt, cancellationToken);

              public Task<IReadOnlyList<WebhookDeliveryLease>> ClaimDueAsync(DateTimeOffset now, TimeSpan leaseDuration, int maxCount, CancellationToken cancellationToken = default) =>
                  inner.ClaimDueAsync(now, leaseDuration, maxCount, cancellationToken);

              public Task<WebhookDeliveryLease> RenewLeaseAsync(WebhookDeliveryLease lease, DateTimeOffset now, TimeSpan leaseDuration, CancellationToken cancellationToken = default) =>
                  inner.RenewLeaseAsync(lease, now, leaseDuration, cancellationToken);

              public Task MarkSucceededAsync(WebhookDeliveryLease lease, DateTimeOffset completedAt, CancellationToken cancellationToken = default) =>
                  inner.MarkSucceededAsync(lease, completedAt, cancellationToken);

              public Task ScheduleRetryAsync(WebhookDeliveryLease lease, DateTimeOffset completedAt, DateTimeOffset nextAttemptAt, string? lastError, CancellationToken cancellationToken = default) =>
                  inner.ScheduleRetryAsync(lease, completedAt, nextAttemptAt, lastError, cancellationToken);

              public Task MarkPermanentlyFailedAsync(WebhookDeliveryLease lease, DateTimeOffset completedAt, string? lastError, CancellationToken cancellationToken = default) =>
                  inner.MarkPermanentlyFailedAsync(lease, completedAt, lastError, cancellationToken);

              public Task DeadLetterAsync(WebhookDeliveryLease lease, DateTimeOffset completedAt, string? lastError, CancellationToken cancellationToken = default) =>
                  inner.DeadLetterAsync(lease, completedAt, lastError, cancellationToken);

              public Task<WebhookDeliverySnapshot?> GetAsync(string webhookId, CancellationToken cancellationToken = default) =>
                  inner.GetAsync(webhookId, cancellationToken);
          }
          EOF

          dotnet run --project "$project" --configuration Release
          ''').replace('          ', ''), encoding='utf-8', newline='\n')

          Path('scripts/verify-public-api.cs').write_text(r'''#:property RestorePackagesWithLockFile=false

          using System.Reflection;
          using System.Reflection.Metadata;
          using System.Reflection.PortableExecutable;

          if (args.Length is < 2 or > 3)
          {
              Console.Error.WriteLine("Usage: dotnet run --file scripts/verify-public-api.cs -- <assembly> <baseline> [--write]");
              return 1;
          }

          string assemblyPath = Path.GetFullPath(args[0]);
          string baselinePath = Path.GetFullPath(args[1]);
          bool write = args.Length == 3 && string.Equals(args[2], "--write", StringComparison.Ordinal);

          if (args.Length == 3 && !write)
          {
              Console.Error.WriteLine("Only --write is accepted as the optional third argument.");
              return 1;
          }

          using FileStream stream = File.OpenRead(assemblyPath);
          using PEReader pe = new(stream);
          MetadataReader reader = pe.GetMetadataReader();
          List<string> actual = BuildSnapshot(reader);

          if (write)
          {
              Directory.CreateDirectory(Path.GetDirectoryName(baselinePath)!);
              File.WriteAllLines(baselinePath,
              [
                  "# ReliableWebhooks public API type/member shape frozen for v0.1.0.",
                  "# Generated by scripts/verify-public-api.cs. Do not edit without deliberate API review.",
                  .. actual,
              ]);
              Console.WriteLine($"Public API baseline written: {baselinePath} ({actual.Count} entries)");
              return 0;
          }

          if (!File.Exists(baselinePath))
          {
              throw new InvalidOperationException($"Public API baseline not found: {baselinePath}");
          }

          List<string> expected = File.ReadLines(baselinePath)
              .Where(static line => !string.IsNullOrWhiteSpace(line) && !line.StartsWith('#'))
              .Order(StringComparer.Ordinal)
              .ToList();

          if (expected.SequenceEqual(actual, StringComparer.Ordinal))
          {
              Console.WriteLine($"Public API snapshot validated: {actual.Count} entries.");
              return 0;
          }

          string[] added = actual.Except(expected, StringComparer.Ordinal).ToArray();
          string[] removed = expected.Except(actual, StringComparer.Ordinal).ToArray();
          Console.Error.WriteLine("Public API changed relative to the v0.1.0 baseline.");
          foreach (string item in added) Console.Error.WriteLine($"+ {item}");
          foreach (string item in removed) Console.Error.WriteLine($"- {item}");
          return 2;

          static List<string> BuildSnapshot(MetadataReader reader)
          {
              List<string> entries = [];
              foreach (TypeDefinitionHandle handle in reader.TypeDefinitions)
              {
                  if (!IsExternallyVisibleType(reader, handle)) continue;
                  TypeDefinition type = reader.GetTypeDefinition(handle);
                  string typeName = GetTypeName(reader, handle);
                  entries.Add($"T:{typeName}");

                  foreach (MethodDefinitionHandle methodHandle in type.GetMethods())
                  {
                      MethodDefinition method = reader.GetMethodDefinition(methodHandle);
                      if (!IsVisible(method.Attributes)) continue;
                      string name = reader.GetString(method.Name);
                      int parameters = 0;
                      foreach (ParameterHandle parameterHandle in method.GetParameters())
                      {
                          if (reader.GetParameter(parameterHandle).SequenceNumber > 0) parameters++;
                      }
                      int genericArity = method.GetGenericParameters().Count;
                      entries.Add($"M:{typeName}.{name}`{genericArity}/{parameters}");
                  }

                  foreach (FieldDefinitionHandle fieldHandle in type.GetFields())
                  {
                      FieldDefinition field = reader.GetFieldDefinition(fieldHandle);
                      if (!IsVisible(field.Attributes)) continue;
                      entries.Add($"F:{typeName}.{reader.GetString(field.Name)}");
                  }
              }

              entries.Sort(StringComparer.Ordinal);
              return entries;
          }

          static bool IsExternallyVisibleType(MetadataReader reader, TypeDefinitionHandle handle)
          {
              TypeDefinition type = reader.GetTypeDefinition(handle);
              TypeAttributes visibility = type.Attributes & TypeAttributes.VisibilityMask;
              if (visibility == TypeAttributes.Public) return true;
              if (visibility is not (TypeAttributes.NestedPublic or TypeAttributes.NestedFamily or TypeAttributes.NestedFamORAssem)) return false;
              TypeDefinitionHandle parent = type.GetDeclaringType();
              return !parent.IsNil && IsExternallyVisibleType(reader, parent);
          }

          static bool IsVisible(MethodAttributes attributes)
          {
              MethodAttributes access = attributes & MethodAttributes.MemberAccessMask;
              return access is MethodAttributes.Public or MethodAttributes.Family or MethodAttributes.FamORAssem;
          }

          static bool IsVisible(FieldAttributes attributes)
          {
              FieldAttributes access = attributes & FieldAttributes.FieldAccessMask;
              return access is FieldAttributes.Public or FieldAttributes.Family or FieldAttributes.FamORAssem;
          }

          static string GetTypeName(MetadataReader reader, TypeDefinitionHandle handle)
          {
              TypeDefinition type = reader.GetTypeDefinition(handle);
              string name = reader.GetString(type.Name);
              TypeDefinitionHandle parent = type.GetDeclaringType();
              if (!parent.IsNil) return $"{GetTypeName(reader, parent)}.{name}";
              string ns = reader.GetString(type.Namespace);
              return string.IsNullOrEmpty(ns) ? name : $"{ns}.{name}";
          }
          ''').replace('          ', ''), encoding='utf-8', newline='\n')

          Path('docs/release-v0.1.0.md').write_text('''# ReliableWebhooks v0.1.0 release

          This document records the release contract for the first public ReliableWebhooks package.

          ## Distribution

          The official release workflow validates one immutable `.nupkg` and publishes that same artifact to:

          - NuGet.org using GitHub OIDC / NuGet Trusted Publishing;
          - GitHub Packages using the scoped `GITHUB_TOKEN`;
          - GitHub Releases as an attached artifact together with symbols, manifest, and checksums.

          No long-lived NuGet API key is stored by the repository.

          ## External release prerequisites

          Before running an official publication from `main`:

          1. configure a NuGet.org Trusted Publishing policy that authorizes this repository, `.github/workflows/release.yml`, and the `release` GitHub environment;
          2. configure the repository variable `NUGET_USER` with the NuGet.org profile authorized by that policy;
          3. keep the GitHub `release` environment approvals/protection rules configured as required by the repository owner.

          The workflow deliberately fails an official `publish=true` request when `NUGET_USER` is absent. A dry run remains credential-free.

          ## Release procedure

          From GitHub Actions, run the `Release` workflow on `main` with:

          - `version`: `0.1.0`;
          - `publish`: `true`.

          The workflow validates SemVer, the exact main SHA, restore/build/tests, public API snapshot, package metadata, Source Link, symbols, a clean custom-store consumer, manifest, checksums, and artifact attestation. It then publishes NuGet.org and GitHub Packages before creating/publishing tag `v0.1.0` and the GitHub Release.

          Re-running the same version is recoverable only when any existing tag resolves to the same validated SHA. Registry pushes use duplicate-safe behavior; a tag pointing to another SHA is rejected.

          ## v0.1.0 guarantees

          - at-least-once delivery when used with a conforming durable `IWebhookDeliveryStore`;
          - stable-ID idempotent enqueue semantics;
          - atomic claim/lease protocol with stale-owner rejection;
          - retry/backoff/jitter and `Retry-After` support;
          - bounded concurrent dispatch and graceful shutdown;
          - HMAC-SHA256 request signing;
          - structured logs, traces, and metrics through standard .NET APIs;
          - Microsoft DI and optional hosted-dispatcher integration.

          ## v0.1.0 limitations

          - no built-in production durable store is included;
          - `InMemoryWebhookDeliveryStore` does not survive process restarts;
          - exactly-once delivery is not guaranteed;
          - receiver-side idempotency remains the receiver's responsibility;
          - dead-letter replay/remediation is application/operations responsibility;
          - persistence adapters (EF Core, Dapper, Redis, files, document stores, and others) are optional and independent of the core package;
          - secret lifecycle/rotation policy is not supplied by the core package.
          ''').replace('          ', ''), encoding='utf-8', newline='\n')

          # Strengthen package verification.
          p = Path('scripts/verify-package.cs')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'AssertEqual("MIT", license?.Value, "LicenseExpression");\nAssertDeprecatedMetadataAbsent(metadata, ns);',
              'AssertEqual("MIT", license?.Value, "LicenseExpression");\nAssertEqual("https://github.com/rodri-oliveira-dev/ReliableWebhooks", metadata.Element(ns + "projectUrl")?.Value, "PackageProjectUrl");\nAssertDependencies(metadata, ns);\nAssertDeprecatedMetadataAbsent(metadata, ns);'
          )
          text = text.replace(
              'var repositoryCommit = repository?.Attribute("commit")?.Value;\n',
              'var repositoryCommit = repository?.Attribute("commit")?.Value;\nAssertEqual("https://github.com/rodri-oliveira-dev/ReliableWebhooks", repositoryUrl, "RepositoryUrl");\n'
          )
          text = text.replace(
              'var assemblyEntry = packageArchive.GetEntry("lib/net10.0/ReliableWebhooks.dll")',
              'var readmeEntry = packageArchive.GetEntry("README.md")\n    ?? throw new InvalidOperationException("README.md não encontrado no .nupkg.");\nusing (var readmeReader = new StreamReader(readmeEntry.Open()))\n{\n    string packagedReadme = readmeReader.ReadToEnd();\n    AssertContains(packagedReadme, "dotnet add package ReliableWebhooks --version 0.1.0", "Package README installation command");\n    AssertContains(packagedReadme, "InMemoryWebhookDeliveryStore", "Package README durability warning");\n    AssertContains(packagedReadme, "not durable", "Package README durability warning");\n}\n\nvar assemblyEntry = packageArchive.GetEntry("lib/net10.0/ReliableWebhooks.dll")'
          )
          insert_marker = 'static void AssertDeprecatedMetadataAbsent(XElement metadata, XNamespace ns)\n'
          helpers = '''static void AssertContains(string value, string expected, string field)
          {
              if (!value.Contains(expected, StringComparison.Ordinal))
              {
                  throw new InvalidOperationException($"{field}: expected content '{expected}' was not found.");
              }
          }

          static void AssertDependencies(XElement metadata, XNamespace ns)
          {
              HashSet<string> expected = new(StringComparer.Ordinal)
              {
                  "Microsoft.Extensions.DependencyInjection.Abstractions",
                  "Microsoft.Extensions.Hosting.Abstractions",
                  "Microsoft.Extensions.Http",
                  "Microsoft.Extensions.Logging.Abstractions",
                  "Microsoft.Extensions.Options",
              };

              HashSet<string> actual = metadata
                  .Descendants(ns + "dependency")
                  .Select(static dependency => dependency.Attribute("id")?.Value)
                  .Where(static id => !string.IsNullOrWhiteSpace(id))
                  .Select(static id => id!)
                  .ToHashSet(StringComparer.Ordinal);

              if (!actual.SetEquals(expected))
              {
                  throw new InvalidOperationException(
                      $"Package dependencies differ from the reviewed v0.1.0 set. Expected: {string.Join(", ", expected.Order())}. Actual: {string.Join(", ", actual.Order())}.");
              }
          }

          '''.replace('          ', '')
          if insert_marker not in text:
              raise SystemExit('verify-package helper marker not found')
          text = text.replace(insert_marker, helpers + insert_marker, 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          # CI: freeze public API, exercise release-gate script, and use the reusable clean consumer check.
          replace_once(
              '.github/workflows/ci.yml',
              '      - name: Compilar\n        run: dotnet build ReliableWebhooks.slnx --configuration Release --no-restore\n\n      - name: Executar sample end-to-end',
              '      - name: Compilar\n        run: dotnet build ReliableWebhooks.slnx --configuration Release --no-restore\n\n      - name: Validar snapshot da API pública v0.1.0\n        run: dotnet run --file scripts/verify-public-api.cs -- src/ReliableWebhooks/bin/Release/net10.0/ReliableWebhooks.dll src/ReliableWebhooks/PublicApi.v0.1.0.txt\n\n      - name: Validar gate de Trusted Publishing\n        shell: bash\n        run: |\n          set -euo pipefail\n          output="$(mktemp)"\n          SHOULD_PUBLISH=false GITHUB_OUTPUT="$output" bash scripts/resolve-nuget-publishing.sh\n          grep -Fq \'nuget_publishing_enabled=false\' "$output"\n          if SHOULD_PUBLISH=true NUGET_USER= GITHUB_OUTPUT="$output" bash scripts/resolve-nuget-publishing.sh; then\n            echo \'Publish request without NUGET_USER should fail.\' >&2\n            exit 1\n          fi\n          : > "$output"\n          SHOULD_PUBLISH=true NUGET_USER=rodri-oliveira-dev GITHUB_OUTPUT="$output" bash scripts/resolve-nuget-publishing.sh\n          grep -Fq \'nuget_publishing_enabled=true\' "$output"\n\n      - name: Executar sample end-to-end'
          )

          ci = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          start = ci.index('      - name: Validar consumo do pacote local\n')
          end = ci.index('      - name: Verificar baseline de governança\n', start)
          replacement = '''      - name: Validar consumo do pacote local com store customizado
            shell: bash
            run: |
              project="src/ReliableWebhooks/ReliableWebhooks.csproj"
              version="$(dotnet msbuild "$project" -nologo -getProperty:PackageVersion | tr -d '\\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"
              bash scripts/verify-package-consumer.sh artifacts/packages "$version"

          '''.replace('          ', '')
          Path('.github/workflows/ci.yml').write_text(ci[:start] + replacement + ci[end:], encoding='utf-8', newline='\n')

          # Release workflow hardening and dual registry publication.
          release = Path('.github/workflows/release.yml').read_text(encoding='utf-8')
          release = release.replace(
              '      - scripts/verify-package.cs\n',
              '      - scripts/verify-package.cs\n      - scripts/verify-package-consumer.sh\n      - scripts/verify-public-api.cs\n      - src/ReliableWebhooks/PublicApi.v0.1.0.txt\n      - docs/release-v0.1.0.md\n',
              1
          )
          release = release.replace(
              '      - name: Run tests\n        run: dotnet test ReliableWebhooks.slnx --configuration Release --no-build\n',
              '      - name: Verify public API snapshot\n        run: dotnet run --file scripts/verify-public-api.cs -- src/ReliableWebhooks/bin/Release/net10.0/ReliableWebhooks.dll src/ReliableWebhooks/PublicApi.v0.1.0.txt\n\n      - name: Run tests\n        run: dotnet test ReliableWebhooks.slnx --configuration Release --no-build\n',
              1
          )
          release = release.replace(
              '      - name: Generate release manifest and checksums\n',
              '      - name: Validate clean consumer with custom store\n        env:\n          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}\n        run: bash scripts/verify-package-consumer.sh artifacts/release "$RELEASE_VERSION"\n\n      - name: Generate release manifest and checksums\n',
              1
          )
          release = release.replace(
              '      artifact-metadata: write\n',
              '      artifact-metadata: write\n      packages: write\n',
              1
          )
          release = release.replace(
              '          if [[ "$NUGET_PUBLISHING_ENABLED" != "true" ]]; then\n            echo "NuGet publication is skipped because NUGET_USER is not configured."\n          fi\n',
              '          if [[ "$NUGET_PUBLISHING_ENABLED" != "true" ]]; then\n            echo "Official publication requires NuGet.org Trusted Publishing (NUGET_USER)." >&2\n            exit 2\n          fi\n',
              1
          )

          draft_start = release.index('      - name: Create or resume draft GitHub Release\n')
          nuget_auth_start = release.index('      - name: Authenticate to NuGet.org with Trusted Publishing\n', draft_start)
          draft_block = release[draft_start:nuget_auth_start]
          release = release[:draft_start] + release[nuget_auth_start:]

          publish_release_marker = '      - name: Publish GitHub Release\n'
          publish_release_index = release.index(publish_release_marker)
          github_packages = '''      - name: Publish package to GitHub Packages
            env:
              GITHUB_PACKAGES_TOKEN: ${{ github.token }}
              PACKAGE_ID: ${{ needs.build.outputs.package-id }}
              RELEASE_VERSION: ${{ needs.build.outputs.version }}
              GITHUB_PACKAGES_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
            run: >-
              dotnet nuget push
              "artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.nupkg"
              --source "$GITHUB_PACKAGES_SOURCE"
              --api-key "$GITHUB_PACKAGES_TOKEN"
              --skip-duplicate

          '''.replace('          ', '')
          release = release[:publish_release_index] + github_packages + draft_block + release[publish_release_index:]
          Path('.github/workflows/release.yml').write_text(release, encoding='utf-8', newline='\n')

      - name: Restore and build
        run: |
          dotnet tool restore
          dotnet restore ReliableWebhooks.slnx --locked-mode
          dotnet build ReliableWebhooks.slnx --configuration Release --no-restore

      - name: Generate v0.1.0 public API baseline
        run: >-
          dotnet run --file scripts/verify-public-api.cs --
          src/ReliableWebhooks/bin/Release/net10.0/ReliableWebhooks.dll
          src/ReliableWebhooks/PublicApi.v0.1.0.txt
          --write

      - name: Format and validate prepared files
        run: |
          dotnet format ReliableWebhooks.slnx --no-restore
          dotnet build ReliableWebhooks.slnx --configuration Release --no-restore
          dotnet run --file scripts/verify-public-api.cs -- src/ReliableWebhooks/bin/Release/net10.0/ReliableWebhooks.dll src/ReliableWebhooks/PublicApi.v0.1.0.txt
          bash -n scripts/resolve-nuget-publishing.sh
          bash -n scripts/verify-package-consumer.sh

      - name: Commit prepared release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . ':!.github/workflows/temp-issue-13-prepare.yml'
          git commit -m "feat: harden v0.1.0 release and publication"
          git push
