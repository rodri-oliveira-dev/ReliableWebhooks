name: Release

run-name: "Release ${{ inputs.version || 'dry-run' }} from ${{ github.ref_name }}"

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/release.yml
      - scripts/ensure-release-tag.sh
      - scripts/publish-release-package.cs
      - scripts/release-candidate.cs
      - scripts/resolve-release-request.sh
      - scripts/resolve-nuget-publishing.sh
      - scripts/verify-package.cs
      - scripts/verify-package-consumer.sh
      - scripts/verify-public-api.cs
      - scripts/verify-registry-package.cs
      - src/ReliableWebhooks/PublicApi.v1.0.0.txt
      - docs/release-v1.0.0.md
      - docs/release-v1.0.0.pt-BR.md
      - src/**
      - tests/**
      - Directory.Build.props
      - Directory.Packages.props
      - ReliableWebhooks.slnx
      - global.json
      - packages.lock.json
      - README.md
      - README.pt-BR.md
      - CHANGELOG.md
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix, for example 1.0.0 or 1.1.0-beta.1.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CI: "true"

jobs:
  build-and-pack:
    name: Validate, build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-metadata.outputs.version }}
      tag: ${{ steps.release-metadata.outputs.tag }}
      is-prerelease: ${{ steps.release-metadata.outputs.is_prerelease }}
      commit: ${{ steps.release-commit.outputs.commit }}
      package-id: ${{ steps.package.outputs.package_id }}
      artifact-name: ${{ steps.release-artifact.outputs.artifact_name }}
      nuget-publishing-enabled: ${{ steps.nuget-publishing.outputs.nuget_publishing_enabled }}
      nuget-publishing-reason: ${{ steps.nuget-publishing.outputs.nuget_publishing_reason }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve release metadata
        id: release-metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version || format('0.0.0-ci.{0}', github.run_number) }}
        run: bash scripts/resolve-release-request.sh

      - name: Record validated commit
        id: release-commit
        shell: bash
        run: echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies in locked mode
        run: dotnet restore ReliableWebhooks.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format ReliableWebhooks.slnx --verify-no-changes --no-restore

      - name: Resolve package identity
        id: package
        shell: bash
        run: |
          set -euo pipefail

          project='src/ReliableWebhooks/ReliableWebhooks.csproj'
          package_id="$(dotnet msbuild "$project" -nologo -getProperty:PackageId \
            | tr -d '\r' \
            | sed '/^[[:space:]]*$/d' \
            | tail -n 1)"

          if [[ -z "$package_id" ]]; then
            echo '::error::PackageId could not be resolved.'
            exit 1
          fi

          echo "package_id=$package_id" >> "$GITHUB_OUTPUT"

      - name: Preflight release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release-metadata.outputs.tag }}
          VALIDATED_SHA: ${{ steps.release-commit.outputs.commit }}
        run: |
          set -euo pipefail

          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            existing_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ "${existing_sha}" != "${VALIDATED_SHA}" ]]; then
              echo "Tag ${RELEASE_TAG} points to ${existing_sha}, not validated SHA ${VALIDATED_SHA}." >&2
              exit 2
            fi
            echo "Tag ${RELEASE_TAG} already points to the validated commit; publication can be resumed."
          else
            echo "Tag ${RELEASE_TAG} does not currently exist."
          fi

      - name: Resolve NuGet publishing opt-in
        id: nuget-publishing
        shell: bash
        env:
          SHOULD_PUBLISH: ${{ steps.release-metadata.outputs.should_publish }}
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: bash scripts/resolve-nuget-publishing.sh

      - name: Validate resolved MSBuild version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
        run: |
          set -euo pipefail

          project='src/ReliableWebhooks/ReliableWebhooks.csproj'

          resolved_version="$(dotnet msbuild "$project" -nologo -getProperty:Version -p:Version="$RELEASE_VERSION" \
            | tr -d '\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"
          resolved_package_version="$(dotnet msbuild "$project" -nologo -getProperty:PackageVersion -p:Version="$RELEASE_VERSION" \
            | tr -d '\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"

          if [[ "$resolved_version" != "$RELEASE_VERSION" ]]; then
            echo "::error::Resolved Version '$resolved_version' differs from release version '$RELEASE_VERSION'."
            exit 1
          fi

          if [[ "$resolved_package_version" != "$RELEASE_VERSION" ]]; then
            echo "::error::Resolved PackageVersion '$resolved_package_version' differs from release version '$RELEASE_VERSION'."
            exit 1
          fi

      - name: Build Release
        env:
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
        run: >-
          dotnet build ReliableWebhooks.slnx
          --configuration Release
          --no-restore
          -p:Version="$RELEASE_VERSION"

      - name: Run tests
        run: dotnet test ReliableWebhooks.slnx --configuration Release --no-build

      - name: Verify public API snapshot
        run: >-
          dotnet run --file scripts/verify-public-api.cs --
          src/ReliableWebhooks/bin/Release/net10.0/ReliableWebhooks.dll
          src/ReliableWebhooks/PublicApi.v1.0.0.txt

      - name: Pack release package
        env:
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
        run: >-
          dotnet pack src/ReliableWebhooks/ReliableWebhooks.csproj
          --configuration Release
          --no-build
          --output artifacts/release
          -p:Version="$RELEASE_VERSION"

      - name: Validate package, version, assembly metadata, symbols and Source Link
        env:
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
        run: >-
          dotnet run --file scripts/verify-package.cs -- artifacts/release
          --require-source-link
          --expected-version "$RELEASE_VERSION"

      - name: Validate clean consumer with custom store
        env:
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
        run: bash scripts/verify-package-consumer.sh artifacts/release "$RELEASE_VERSION"

      - name: Generate package SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: artifacts/release/${{ steps.package.outputs.package_id }}.${{ steps.release-metadata.outputs.version }}.nupkg
          format: spdx-json
          output-file: artifacts/release/${{ steps.package.outputs.package_id }}.${{ steps.release-metadata.outputs.version }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate package SBOM
        shell: bash
        env:
          PACKAGE_ID: ${{ steps.package.outputs.package_id }}
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
        run: |
          set -euo pipefail

          sbom="artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.sbom.spdx.json"
          test -s "$sbom"
          jq -e '
            (.spdxVersion | startswith("SPDX-"))
            and (.packages | type == "array")
            and ((.packages | length) > 0)
          ' "$sbom" >/dev/null

      - name: Generate release manifest and checksums
        env:
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.release-metadata.outputs.tag }}
          PACKAGE_ID: ${{ steps.package.outputs.package_id }}
        run: >-
          dotnet run --file scripts/release-candidate.cs -- manifest
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_TAG"
          --commit "$GITHUB_SHA"
          --package-id "$PACKAGE_ID"
          --package "artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.nupkg"
          --symbols "artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.snupkg"
          --sbom "artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.sbom.spdx.json"
          --output artifacts/release/release-manifest.json
          --checksums-output artifacts/release/SHA256SUMS

      - name: Record release artifact name
        id: release-artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
        run: echo "artifact_name=release-candidate-${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload validated release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release-artifact.outputs.artifact_name }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14

  ensure-release-tag:
    name: Create or verify release tag
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build-and-pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag-created: ${{ steps.release-tag.outputs.tag_created }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-and-pack.outputs.commit }}
          fetch-depth: 0

      - name: Create or verify tag
        id: release-tag
        shell: bash
        run: >-
          bash scripts/ensure-release-tag.sh
          --tag "${{ needs.build-and-pack.outputs.tag }}"
          --sha "${{ needs.build-and-pack.outputs.commit }}"

  publish-nuget:
    name: Publish to NuGet.org
    if: ${{ github.event_name == 'workflow_dispatch' && needs.build-and-pack.outputs.nuget-publishing-enabled == 'true' }}
    needs:
      - build-and-pack
      - ensure-release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-and-pack.outputs.artifact-name }}
          path: artifacts/release

      - name: Verify downloaded release candidate
        env:
          RELEASE_VERSION: ${{ needs.build-and-pack.outputs.version }}
          RELEASE_TAG: ${{ needs.build-and-pack.outputs.tag }}
          PACKAGE_ID: ${{ needs.build-and-pack.outputs.package-id }}
        run: >-
          dotnet run --file scripts/release-candidate.cs -- verify
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_TAG"
          --commit "${{ needs.build-and-pack.outputs.commit }}"
          --package-id "$PACKAGE_ID"
          --package "artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.nupkg"
          --symbols "artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.snupkg"
          --sbom "artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.sbom.spdx.json"
          --manifest artifacts/release/release-manifest.json
          --checksums artifacts/release/SHA256SUMS

      - name: Authenticate to NuGet.org with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish validated package to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          NUGET_USER: ${{ vars.NUGET_USER }}
          PACKAGE_ID: ${{ needs.build-and-pack.outputs.package-id }}
          RELEASE_VERSION: ${{ needs.build-and-pack.outputs.version }}
        run: >-
          dotnet run --file scripts/publish-release-package.cs --
          --registry NuGetOrg
          --source https://api.nuget.org/v3/index.json
          --package "artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.nupkg"
          --symbols "artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.snupkg"
          --package-id "$PACKAGE_ID"
          --version "$RELEASE_VERSION"
          --api-key-env NUGET_API_KEY
          --nuget-user-env NUGET_USER
          --convergence-attempts 60
          --convergence-delay-seconds 10

  publish-github-packages:
    name: Publish to GitHub Packages
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - build-and-pack
      - ensure-release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-and-pack.outputs.artifact-name }}
          path: artifacts/release

      - name: Verify downloaded release candidate
        env:
          RELEASE_VERSION: ${{ needs.build-and-pack.outputs.version }}
          RELEASE_TAG: ${{ needs.build-and-pack.outputs.tag }}
          PACKAGE_ID: ${{ needs.build-and-pack.outputs.package-id }}
        run: >-
          dotnet run --file scripts/release-candidate.cs -- verify
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_TAG"
          --commit "${{ needs.build-and-pack.outputs.commit }}"
          --package-id "$PACKAGE_ID"
          --package "artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.nupkg"
          --symbols "artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.snupkg"
          --sbom "artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.sbom.spdx.json"
          --manifest artifacts/release/release-manifest.json
          --checksums artifacts/release/SHA256SUMS

      - name: Publish validated package to GitHub Packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          PACKAGE_ID: ${{ needs.build-and-pack.outputs.package-id }}
          RELEASE_VERSION: ${{ needs.build-and-pack.outputs.version }}
          GITHUB_PACKAGES_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: >-
          dotnet run --file scripts/publish-release-package.cs --
          --registry GitHubPackages
          --source "$GITHUB_PACKAGES_SOURCE"
          --package "artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.nupkg"
          --package-id "$PACKAGE_ID"
          --version "$RELEASE_VERSION"
          --api-key-env GITHUB_PACKAGES_TOKEN
          --username "${{ github.repository_owner }}"
          --token-env GITHUB_PACKAGES_TOKEN
          --convergence-attempts 12
          --convergence-delay-seconds 10

  github-release:
    name: Publish GitHub Release
    if: >-
      ${{
        always()
        && github.event_name == 'workflow_dispatch'
        && needs.build-and-pack.result == 'success'
        && needs.ensure-release-tag.result == 'success'
        && needs.publish-github-packages.result == 'success'
        && (needs.publish-nuget.result == 'success' || needs.publish-nuget.result == 'skipped')
      }}
    needs:
      - build-and-pack
      - ensure-release-tag
      - publish-nuget
      - publish-github-packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-and-pack.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-and-pack.outputs.artifact-name }}
          path: artifacts/release

      - name: Verify downloaded release candidate
        env:
          RELEASE_VERSION: ${{ needs.build-and-pack.outputs.version }}
          RELEASE_TAG: ${{ needs.build-and-pack.outputs.tag }}
          PACKAGE_ID: ${{ needs.build-and-pack.outputs.package-id }}
        run: >-
          dotnet run --file scripts/release-candidate.cs -- verify
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_TAG"
          --commit "${{ needs.build-and-pack.outputs.commit }}"
          --package-id "$PACKAGE_ID"
          --package "artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.nupkg"
          --symbols "artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.snupkg"
          --sbom "artifacts/release/${PACKAGE_ID}.${RELEASE_VERSION}.sbom.spdx.json"
          --manifest artifacts/release/release-manifest.json
          --checksums artifacts/release/SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/release/${{ needs.build-and-pack.outputs.package-id }}.${{ needs.build-and-pack.outputs.version }}.nupkg
            artifacts/release/${{ needs.build-and-pack.outputs.package-id }}.${{ needs.build-and-pack.outputs.version }}.snupkg
            artifacts/release/${{ needs.build-and-pack.outputs.package-id }}.${{ needs.build-and-pack.outputs.version }}.sbom.spdx.json
            artifacts/release/release-manifest.json
            artifacts/release/SHA256SUMS

      - name: Attest package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/release/${{ needs.build-and-pack.outputs.package-id }}.${{ needs.build-and-pack.outputs.version }}.nupkg
          sbom-path: artifacts/release/${{ needs.build-and-pack.outputs.package-id }}.${{ needs.build-and-pack.outputs.version }}.sbom.spdx.json

      - name: Create or resume draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-and-pack.outputs.tag }}
          VALIDATED_SHA: ${{ needs.build-and-pack.outputs.commit }}
        run: |
          set -euo pipefail

          git fetch --tags origin
          existing_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if [[ "${existing_sha}" != "${VALIDATED_SHA}" ]]; then
            echo "Tag ${RELEASE_TAG} points to ${existing_sha}, not validated SHA ${VALIDATED_SHA}." >&2
            exit 3
          fi

          release_state="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "${release_state}" == "false" ]]; then
            echo "Release ${RELEASE_TAG} is already published; refusing to mutate published release assets." >&2
            exit 3
          fi

          if [[ -z "${release_state}" ]]; then
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "${RELEASE_TAG}"
          fi

          gh release upload "${RELEASE_TAG}" \
            "artifacts/release/${{ needs.build-and-pack.outputs.package-id }}.${{ needs.build-and-pack.outputs.version }}.nupkg" \
            "artifacts/release/${{ needs.build-and-pack.outputs.package-id }}.${{ needs.build-and-pack.outputs.version }}.snupkg" \
            "artifacts/release/${{ needs.build-and-pack.outputs.package-id }}.${{ needs.build-and-pack.outputs.version }}.sbom.spdx.json" \
            artifacts/release/release-manifest.json \
            artifacts/release/SHA256SUMS \
            --clobber

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-and-pack.outputs.tag }}
          IS_PRERELEASE: ${{ needs.build-and-pack.outputs.is-prerelease }}
        run: |
          set -euo pipefail

          gh release edit "${RELEASE_TAG}" \
            --draft=false \
            --prerelease="${IS_PRERELEASE}" >/dev/null
