name: Temporary Codex API baseline

on:
  push:
    branches:
      - release/issue-13-v0.1.0

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Patch verifier analyzer settings and dependency resolution
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-public-api.cs')
          text = path.read_text(encoding='utf-8')
          if '#:property EnableTrimAnalyzer=false' not in text:
              text = text.replace(
                  '#:property RestorePackagesWithLockFile=false\n',
                  '#:property RestorePackagesWithLockFile=false\n#:property EnableTrimAnalyzer=false\n',
                  1,
              )

          class_start = text.index('sealed class SnapshotLoadContext : AssemblyLoadContext')
          replacement = '''internal sealed class SnapshotLoadContext : AssemblyLoadContext
          {
              private readonly string assemblyDirectory;
              private readonly string nugetPackagesDirectory;

              public SnapshotLoadContext(string assemblyPath)
                  : base(isCollectible: true)
              {
                  assemblyDirectory = Path.GetDirectoryName(assemblyPath)
                      ?? throw new ArgumentException("Assembly path must have a directory.", nameof(assemblyPath));
                  nugetPackagesDirectory = Environment.GetEnvironmentVariable("NUGET_PACKAGES")
                      ?? Path.Combine(
                          Environment.GetFolderPath(Environment.SpecialFolder.UserProfile),
                          ".nuget",
                          "packages");
              }

              protected override Assembly? Load(AssemblyName assemblyName)
              {
                  if (string.IsNullOrWhiteSpace(assemblyName.Name))
                  {
                      return null;
                  }

                  string localCandidate = Path.Combine(assemblyDirectory, $"{assemblyName.Name}.dll");
                  if (File.Exists(localCandidate))
                  {
                      return LoadFromAssemblyPath(localCandidate);
                  }

                  string packageRoot = Path.Combine(
                      nugetPackagesDirectory,
                      assemblyName.Name.ToLowerInvariant());
                  if (!Directory.Exists(packageRoot))
                  {
                      return null;
                  }

                  string librarySegment = $"{Path.DirectorySeparatorChar}lib{Path.DirectorySeparatorChar}";
                  string? packageCandidate = Directory
                      .EnumerateFiles(packageRoot, $"{assemblyName.Name}.dll", SearchOption.AllDirectories)
                      .OrderByDescending(
                          candidate => candidate.Contains(librarySegment, StringComparison.Ordinal))
                      .ThenByDescending(static candidate => candidate, StringComparer.Ordinal)
                      .FirstOrDefault();

                  return packageCandidate is null ? null : LoadFromAssemblyPath(packageCandidate);
              }
          }
          '''.replace('          ', '')
          text = text[:class_start] + replacement
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build release assembly
        run: |
          dotnet restore ReliableWebhooks.slnx --locked-mode
          dotnet build ReliableWebhooks.slnx --configuration Release --no-restore

      - name: Regenerate and verify public API baseline
        run: |
          dotnet run --file scripts/verify-public-api.cs -- src/ReliableWebhooks/bin/Release/net10.0/ReliableWebhooks.dll src/ReliableWebhooks/PublicApi.v0.1.0.txt --write
          dotnet run --file scripts/verify-public-api.cs -- src/ReliableWebhooks/bin/Release/net10.0/ReliableWebhooks.dll src/ReliableWebhooks/PublicApi.v0.1.0.txt

      - name: Commit verifier and baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-public-api.cs src/ReliableWebhooks/PublicApi.v0.1.0.txt
          if git diff --cached --quiet; then
            echo "Verifier and baseline are already current."
            exit 0
          fi
          git commit -m "test: regenerate v0.1.0 public API signatures"
          git push
