name: Lock refresh temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Regenerar lock files
        run: dotnet restore ReliableWebhooks.slnx --force-evaluate

      - name: Persistir lock files gerados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ReliableWebhooks/packages.lock.json tests/ReliableWebhooks.Tests/packages.lock.json

          if git diff --cached --quiet; then
            echo "Lock files já estão atualizados."
            exit 0
          fi

          git commit -m "build: atualizar lock files"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
