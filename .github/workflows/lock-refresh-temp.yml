name: Lock refresh temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Regenerar lock files
        run: dotnet restore ReliableWebhooks.slnx --force-evaluate

      - name: Emitir lock files
        shell: bash
        run: |
          echo "SRC_LOCK_BEGIN"
          base64 -w0 src/ReliableWebhooks/packages.lock.json
          echo
          echo "SRC_LOCK_END"
          echo "TEST_LOCK_BEGIN"
          base64 -w0 tests/ReliableWebhooks.Tests/packages.lock.json
          echo
          echo "TEST_LOCK_END"
